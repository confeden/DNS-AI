[workspace]
resolver = "2"
members = ["core", "client"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[workspace.dependencies]
dns-ai-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

# Release profile: this ships to end users, so optimise for size and strip.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
